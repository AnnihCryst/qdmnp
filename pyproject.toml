[project]
name = "qd-mnp"
version = "3.0.0"
description = "Квазистатическая модель гибридной системы КТ–МНЧ: ядра, наблюдаемые и конвейер расчёта статьи"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "matplotlib>=3.10.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src layout: `uv sync` installs the project itself, so `import qdmnp` resolves
# in the test suite and in every calculator subprocess without path juggling.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
