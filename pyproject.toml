[project]
name = "qd-mnp"
version = "3.0.0"
description = "Квазистатическая модель гибридной системы КТ–МНЧ: ядра, наблюдаемые и конвейер расчёта статьи"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "matplotlib>=3.10.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Source files live directly in src; installation keeps the qdmnp import name
# for the test suite, calculator subprocesses and existing user scripts.
[tool.setuptools]
package-dir = {"qdmnp" = "src"}
packages = [
    "qdmnp",
    "qdmnp.observables",
    "qdmnp.verification",
    "qdmnp.verification.literature_reproductions",
]
